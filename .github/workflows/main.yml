
name: KP NEXUS 2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: SDK installieren
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android-Projekt erstellen
        run: |
          test -f index.html
          test -f "Launch Sequence.mp3"
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/de/kiansphotography/kpnexus
          cp index.html app/src/main/assets/index.html
          cp "Launch Sequence.mp3" app/src/main/assets/intro.mp3

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KP-NEXUS-2"
          include(":app")
          EOF

          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle
          echo "android.useAndroidX=true" > gradle.properties

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'de.kiansphotography.kpnexus'
              compileSdk 35
              defaultConfig {
                  applicationId 'de.kiansphotography.kpnexus'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:theme="@android:style/Theme.Material.NoActionBar" android:label="KP NEXUS 2">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/de/kiansphotography/kpnexus/MainActivity.java <<'EOF'
          package de.kiansphotography.kpnexus;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceRequest;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;
          public class MainActivity extends Activity {
              WebView web;
              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(true);
                  WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
                  web.setWebViewClient(new WebViewClientCompat() {
                      public android.webkit.WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }
                  });
                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }
          }
          EOF

      - name: APK bauen
        run: gradle --no-daemon assembleDebug

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: KP-NEXUS-2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
